name: Refresh M+ cohort data

# Several daily opportunities: GitHub can delay or drop individual schedule events.
# The release week starts Wednesday 06:30 UTC, after the EU reset. A missed week stays due
# on later days; a successful publication makes subsequent scheduled runs plan-only (#44).
# AUTO_DATA_RELEASE=true enables publication. The first release is always made by hand.
# Closed weeks are cached as an aggregated state; only the current week is fetched again.
on:
  schedule:
    - cron: "47 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Ignore the cached state and scan every week again"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: refresh-mplus-data
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      refresh: ${{ steps.plan.outputs.refresh }}
      release_due: ${{ steps.plan.outputs.release_due }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "lupa==2.6"
      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO: ${{ vars.AUTO_DATA_RELEASE == 'true' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > "$RUNNER_TEMP/releases.json"
          last_refresh="$(python tools/pick_data_run.py --repo "$GITHUB_REPOSITORY" --timestamp)"
          python tools/data_release.py plan --releases "$RUNNER_TEMP/releases.json" \
            --automatic "$AUTO" --event "$GITHUB_EVENT_NAME" --last-refresh "$last_refresh" \
            > "$RUNNER_TEMP/plan.json"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "plan.json").read_text())
          print("weekly plan:", json.dumps(plan))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for field in ("refresh", "release_due"):
                  output.write(f"{field}={str(plan[field]).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Plan\n")
              summary.write(f"- automatic data releases: `{os.environ['AUTO']}`\n")
              summary.write(f"- refresh: `{plan['refresh']}`, release due: `{plan['release_due']}`\n")
              if "nextDueAt" in plan:
                  when = datetime.fromtimestamp(plan["nextDueAt"], timezone.utc).isoformat()
                  summary.write(f"- release window: `{when}`\n")
          PY

  refresh:
    needs: plan
    if: ${{ needs.plan.outputs.refresh == 'true' }}
    runs-on: ubuntu-latest
    # the first full scan ran past 60 minutes on a GitHub runner; incremental weeks need far less
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # outside the workspace, so nothing here can be committed or packaged
      - name: Set paths
        run: |
          echo "STATE_DIR=$RUNNER_TEMP/mplus-state" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/mplus-out" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install "lupa==2.6" "pytest==8.4.2"

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      # The state holds character identities of closed weeks. It lives only in this repository's
      # private Actions cache; the provider discards it after 27 days or on a new season.
      - name: Restore closed-week state
        if: ${{ !inputs.full_scan }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_DIR }}
          key: mplus-state-${{ github.run_id }}
          restore-keys: mplus-state-

      # A full first scan with hero talent cohorts needed about 30,000 requests (season 18).
      # 36,000 is Blizzard's hourly limit; weekly incremental runs need far less.
      - name: Certify top 30 per specialization
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          mkdir -p "$OUT_DIR"
          python tools/providers/blizzard_mplus.py \
            --max-requests 36000 --max-profiles 400 --hero-walk-deep 400 \
            --state "$STATE_DIR/mplus-state.json.gz" \
            --output "$OUT_DIR/report.json" \
            --observations "$OUT_DIR/observations.json" > /dev/null

      # Saved even when certification fails: the closed weeks were stored before the current week.
      - name: Save closed-week state
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_DIR }}
          key: mplus-state-${{ github.run_id }}

      - name: Generate Data.lua candidate
        run: python tools/blizzard_dataset.py --observations "$OUT_DIR/observations.json" --output "$OUT_DIR/Data.lua"

      - name: Summary
        if: ${{ always() }}
        run: python tools/mplus_summary.py "$OUT_DIR/report.json" >> "$GITHUB_STEP_SUMMARY"

      # Identity-free outputs only: report, observations and the candidate Data.lua.
      - uses: actions/upload-artifact@v4
        with:
          name: mplus-data-${{ github.run_number }}
          path: ${{ env.OUT_DIR }}
          retention-days: 30

  # Commits the data release changelog to main and tags it. Every check is fail-closed:
  # tools/release_gate.py refuses on a missing or unverified previous release, low coverage,
  # identity keys in Data.lua, API errors, or data valid for less than 7 days.
  # Planning and this final gate share the weekly-window calculation.
  data-release:
    needs: [plan, refresh]
    if: ${{ needs.plan.outputs.release_due == 'true' && needs.refresh.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "lupa==2.6"
      - uses: actions/download-artifact@v4
        with:
          name: mplus-data-${{ github.run_number }}
          path: ${{ runner.temp }}/data
      - name: Gate and changelog
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > "$RUNNER_TEMP/releases.json"
          git tag -l 'v*' > "$RUNNER_TEMP/tags.txt"
          result="$(python tools/data_release.py prepare --releases "$RUNNER_TEMP/releases.json" \
            --report "$RUNNER_TEMP/data/report.json" --data "$RUNNER_TEMP/data/Data.lua" \
            --tags "$RUNNER_TEMP/tags.txt" --sha "$GITHUB_SHA")"
          echo "$result"
          tag="$(python -c "import json,sys; r=json.loads(sys.argv[1]); print(r.get('tag', '') if r['release'] else '')" "$result")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Commit changelog and tag
        if: ${{ steps.prepare.outputs.tag != '' }}
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          python tools/generate_changelog.py
          python tools/generate_changelog.py --check --require "${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog CHANGELOG.md
          git commit -m "chore(release): publish weekly data for $TAG" \
            -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          # fails when main moved on since the run started: no tag, no release
          git push origin "HEAD:refs/heads/main"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so the release is called directly.
  publish:
    needs: data-release
    if: ${{ needs.data-release.outputs.tag != '' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    secrets: inherit          # CF_API_KEY for the CurseForge upload
    with:
      tag: ${{ needs.data-release.outputs.tag }}
      data_artifact: mplus-data-${{ github.run_number }}
