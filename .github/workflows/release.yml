name: Release

# Only tags v* create a release (CalVer, e.g. v2026.10.3). Pushes to main release nothing.
# workflow_dispatch is a dry run: the packager runs with -d (no upload) and the ZIP is kept as an artifact.
# Wago imports the finished GitHub release through its webhook. CurseForge gets the same package by API
# upload (CF_API_KEY): its own repository packager would build from the repo, where Data.lua is empty.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # automatic data releases: refresh-mplus-data.yml tags a commit and calls this workflow
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      data_artifact:
        description: "Data artifact of the calling run (mplus-data-N)"
        type: string
        required: true

permissions:
  contents: write   # create the GitHub release
  actions: read     # download the data artifact of the latest weekly refresh

jobs:
  package:
    name: Package and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      # set by a workflow_call; empty for tag pushes and manual dry runs
      CALL_TAG: ${{ inputs.tag }}
      # a manual run of this workflow is a dry run; a tag push or a workflow_call publishes
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # full history and tags, so the packager can derive version and changelog from the tag
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install "lupa==2.6" "pytest==8.4.2"

      - name: Quality gate
        run: python -m pytest -q -p no:cacheprovider

      - name: Changelog gate
        # A tagged release needs its bilingual pair; CHANGELOG.md must match the generator byte for byte.
        run: |
          tag="$CALL_TAG"
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; fi
          if [ -n "$tag" ]; then
            python tools/generate_changelog.py --check --require "${tag#v}"
          else
            python tools/generate_changelog.py --check
          fi

      # The repository keeps StatCompass/Data.lua empty. A release ships the Data.lua of the latest
      # successful weekly refresh, checked with the addon's own runtime before it is packed.
      - name: Fetch data of the calling run
        if: ${{ inputs.data_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.data_artifact }}
          path: ${{ runner.temp }}/data

      - name: Fetch latest refresh data
        if: ${{ inputs.data_artifact == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-mplus-data.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "No successful refresh run on main; nothing to release." >&2
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'mplus-data-*' --dir "$RUNNER_TEMP/data"
          echo "DATA_LUA=$(find "$RUNNER_TEMP/data" -name Data.lua | head -1)" >> "$GITHUB_ENV"
          echo "DATA_RUN=$run_id" >> "$GITHUB_ENV"

      - name: Check and install release data
        run: |
          DATA_LUA="${DATA_LUA:-$(find "$RUNNER_TEMP/data" -name Data.lua | head -1)}"
          python tools/release_data.py "$DATA_LUA" --min-days 7 --install

      # Build first and check the package before anything is published (issue #10).
      - name: Build package (no upload)
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Verify package
        run: python tools/verify_package.py

      # Only after the check: the same tree is packaged again and published.
      - name: Publish
        if: ${{ env.DRY_RUN != 'true' }}
        uses: BigWigsMods/packager@v2
        env:
          # Provided by the runner: creates the GitHub release, which Wago imports by webhook.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Uploads the same package to CurseForge (X-Curse-Project-ID in the TOC); skipped while unset.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Verify published package
        if: ${{ env.DRY_RUN != 'true' }}
        run: python tools/verify_package.py

      - name: Keep dry-run package
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: stat-compass-dry-run
          path: .release/*.zip
          # .release is a dot directory, which upload-artifact skips unless told otherwise
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "## Stat Compass release"
            echo
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\` on \`${GITHUB_REF_NAME}\`"
            echo "- Data: refresh run ${DATA_RUN:-none}"
            if [ "$DRY_RUN" = "true" ]; then
              echo "- Dry run: nothing uploaded; the package is attached as artifact \`stat-compass-dry-run\`."
            else
              echo "- GitHub release created (Wago imports it by webhook); CurseForge upload by API when CF_API_KEY is set."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
