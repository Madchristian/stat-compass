<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Stat Compass (small sizes)</title>
  <!-- Simplified for 16-48 px (addon list, minimap): bigger rose, no ticks or diagonal points. -->
  <defs>
    <radialGradient id="field" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2a3442"/>
      <stop offset="0.6" stop-color="#151b24"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc8c"/>
      <stop offset="0.45" stop-color="#c9973a"/>
      <stop offset="1" stop-color="#7a5320"/>
    </linearGradient>
    <radialGradient id="hub" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff1bf"/>
      <stop offset="0.5" stop-color="#d9a640"/>
      <stop offset="1" stop-color="#6e4a18"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="92" fill="url(#gold)"/>
  <rect x="34" y="34" width="444" height="444" rx="70" fill="url(#field)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#gold)" stroke-width="22"/>

  <!-- crit (top), haste (right), mastery (bottom), versatility (left); light from the top right -->
  <polygon points="256,256 256,48 300,212" fill="#e46a73"/>
  <polygon points="256,256 256,48 212,212" fill="#a8323b"/>
  <polygon points="256,256 464,256 300,300" fill="#2f5fae"/>
  <polygon points="256,256 464,256 300,212" fill="#6a9cf0"/>
  <polygon points="256,256 256,464 212,300" fill="#a77a22"/>
  <polygon points="256,256 256,464 300,300" fill="#ebbd5c"/>
  <polygon points="256,256 48,256 212,212" fill="#72d39c"/>
  <polygon points="256,256 48,256 212,300" fill="#3a8d5e"/>

  <circle cx="256" cy="256" r="44" fill="url(#hub)" stroke="#5a3c12" stroke-width="8"/>
  <circle cx="256" cy="256" r="14" fill="#151b24"/>
</svg>
