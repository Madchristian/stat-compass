<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Stat Compass</title>
  <defs>
    <!-- deep slate field, slightly lit from the top -->
    <radialGradient id="field" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2a3442"/>
      <stop offset="0.6" stop-color="#151b24"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </radialGradient>
    <!-- WoW-like gold for frame, ring and hub -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc8c"/>
      <stop offset="0.45" stop-color="#c9973a"/>
      <stop offset="1" stop-color="#7a5320"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#6b4618"/>
    </linearGradient>
    <radialGradient id="hub" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff1bf"/>
      <stop offset="0.5" stop-color="#d9a640"/>
      <stop offset="1" stop-color="#6e4a18"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6dc8c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f6dc8c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="8" y="8" width="496" height="496" rx="92" fill="url(#gold)"/>
  <rect x="22" y="22" width="468" height="468" rx="80" fill="url(#goldEdge)"/>
  <rect x="30" y="30" width="452" height="452" rx="74" fill="url(#field)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- compass ring with ticks -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#c9973a" stroke-opacity="0.45" stroke-width="2"/>
  <g stroke="#e8c46a" stroke-linecap="round">
    <g stroke-width="5">
      <line x1="256" y1="70" x2="256" y2="94" transform="rotate(45 256 256)"/>
      <line x1="256" y1="70" x2="256" y2="94" transform="rotate(135 256 256)"/>
      <line x1="256" y1="70" x2="256" y2="94" transform="rotate(225 256 256)"/>
      <line x1="256" y1="70" x2="256" y2="94" transform="rotate(315 256 256)"/>
    </g>
    <g stroke-width="3" stroke-opacity="0.75">
      <line x1="256" y1="72" x2="256" y2="86" transform="rotate(22.5 256 256)"/>
      <line x1="256" y1="72" x2="256" y2="86" transform="rotate(67.5 256 256)"/>
      <line x1="256" y1="72" x2="256" y2="86" transform="rotate(112.5 256 256)"/>
      <line x1="256" y1="72" x2="256" y2="86" transform="rotate(157.5 256 256)"/>
      <line x1="256" y1="72" x2="256" y2="86" transform="rotate(202.5 256 256)"/>
      <line x1="256" y1="72" x2="256" y2="86" transform="rotate(247.5 256 256)"/>
      <line x1="256" y1="72" x2="256" y2="86" transform="rotate(292.5 256 256)"/>
      <line x1="256" y1="72" x2="256" y2="86" transform="rotate(337.5 256 256)"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <!-- minor diagonal points in muted gold -->
    <g fill="#a7802f">
      <polygon points="256,256 368,144 286,250"/>
      <polygon points="256,256 368,368 262,286"/>
      <polygon points="256,256 144,368 226,262"/>
      <polygon points="256,256 144,144 250,226"/>
    </g>
    <g fill="#6e521d">
      <polygon points="256,256 368,144 262,226"/>
      <polygon points="256,256 368,368 286,262"/>
      <polygon points="256,256 144,368 250,286"/>
      <polygon points="256,256 144,144 226,250"/>
    </g>

    <!-- the four stats in Character-window order, clockwise from the top:
         crit (red), haste (blue), mastery (gold), versatility (green); light/dark halves for depth -->
    <polygon points="256,256 256,92 286,226" fill="#e46a73"/>
    <polygon points="256,256 256,92 226,226" fill="#a8323b"/>

    <polygon points="256,256 420,256 286,286" fill="#2f5fae"/>
    <polygon points="256,256 420,256 286,226" fill="#6a9cf0"/>

    <polygon points="256,256 256,420 226,286" fill="#a77a22"/>
    <polygon points="256,256 256,420 286,286" fill="#ebbd5c"/>

    <polygon points="256,256 92,256 226,226" fill="#72d39c"/>
    <polygon points="256,256 92,256 226,286" fill="#3a8d5e"/>
  </g>

  <!-- hub -->
  <circle cx="256" cy="256" r="30" fill="url(#hub)" stroke="#5a3c12" stroke-width="4"/>
  <circle cx="256" cy="256" r="10" fill="#151b24"/>
  <circle cx="249" cy="249" r="6" fill="#fff6d6" fill-opacity="0.8"/>
</svg>
