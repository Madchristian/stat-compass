<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stat Compass synthetic rating preview</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#171b20;color:#e9eef2;font:12px system-ui}h1{font-size:16px;margin:0 0 4px}.notice{color:#e7c781;margin:0 0 8px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}label{display:flex;align-items:center;gap:4px}select{background:#26343c;color:#fff;border:1px solid #596970;border-radius:3px;padding:3px;font:inherit}
.panel{position:relative;border:3px solid #886e3e;background:#29251e;overflow:hidden}.panel.flat{background:#0c1014;border-color:#3a5059}.title,.spec,.tabs,.head,.row,.status,.foot{position:absolute;left:16px;right:16px}.title{color:#f3cf79;font-size:18px;font-weight:700}.spec{font-size:15px}.tabs,.foot{display:flex;gap:10px}.tabs button,.foot button{flex:1;min-width:0;background:#3d3529;border:1px solid #806b43;color:#f1d484;padding:5px;font:12px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.flat button{background:#1a303c;border-color:#365361;color:#e7f1f6}.head{display:flex;justify-content:space-between;color:#cfc5ab}.row{height:62px}.row .top{display:flex;justify-content:space-between;gap:6px;font-size:14px;font-weight:600;white-space:nowrap}.name{max-width:52%;overflow:hidden;text-overflow:ellipsis}.value{max-width:48%;overflow:hidden;text-overflow:ellipsis;text-align:right}
.track{position:absolute;left:3px;right:3px;background:#191d20;height:20px}.flat .track{background:#17222b}.band{position:absolute;top:-2px;height:calc(100% + 4px);background:#a0adb366}.fill{position:absolute;top:0;bottom:0;left:0}.own{position:absolute;top:-2px;width:3px;height:calc(100% + 4px);background:#fff;transform:translateX(-1px)}.tick{position:absolute;width:3px;height:7px;background:#c5d1d5;transform:translateX(-1px)}.tick.min{bottom:calc(100% - 3px)}.tick.max{top:calc(100% - 3px)}.mean-marker{position:absolute;width:7px;height:7px;background:#ffd159;bottom:calc(100% + 2px);transform:translateX(-3px)}.mean-stem{position:absolute;width:2px;height:2px;background:#ffd159;bottom:100%;transform:translateX(-1px)}.axis-status{position:absolute;left:7px;right:7px;text-align:center;color:#e3c47b;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.labels{position:absolute;left:0;right:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;color:#cdd4d7;font-size:11px;white-space:nowrap}.labels span{overflow:hidden;text-overflow:ellipsis}.labels span:nth-child(2){text-align:center}.labels span:nth-child(3){text-align:right}.status{font-size:11px;color:#cdd1d3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tip{position:fixed;z-index:10;max-width:360px;display:none;padding:8px 10px;background:#10161b;border:1px solid #bb9953;color:#f0f0ea;box-shadow:0 4px 14px #000b;white-space:pre-line;line-height:1.45;pointer-events:none}.tip.visible{display:block}.compact .title{font-size:16px}.compact .spec{font-size:13px}.compact .row .top{font-size:12px}.compact .track{height:16px}.compact .mean-marker{width:5px;height:5px;transform:translateX(-2px)}.compact .labels{font-size:10px}.compact .head,.compact .status{font-size:10px}
</style>
<h1>Rating comparison layout</h1><p class="notice">Synthetic rating points and cap · Browser layout study only · No addon data</p>
<nav><label>Skin <select id="skin"><option value="default">Default</option><option value="flat">Flat dark</option></select></label><label>Locale <select id="locale"><option value="en">English</option><option value="de">Deutsch</option></select></label><label>Fixture <select id="fixture"><option value="normal">Within range</option><option value="outside">Outside range</option><option value="partial">Partial max</option><option value="missing">Unverified cap</option><option value="unavailable">Unavailable source</option><option value="invalid">Invalid source</option><option value="zero">Coincident</option><option value="longnames">Long names</option><option value="extreme">Extreme ratings</option></select></label><label>Size <select id="size"><option value="full">468 × 750</option><option value="small">360 × 424</option></select></label></nav>
<div id="panel" class="panel" aria-label="Synthetic rating comparison"></div><div id="tip" class="tip" role="tooltip"></div>
<script>
const $=s=>document.querySelector(s),keys=['crit','haste','mastery','versatility'];
const copy={en:{names:['Crit','Haste','Mastery','Versatility'],long:['Critical Strike Chance With A Long Name','Haste Rating With A Long Name','Mastery Rating With A Long Name','Versatility Rating With A Long Name'],spec:'Spec: Arcane',raid:'Raid',ref:'Rating reference',current:'Current',min:'Min',mean:'Mean',max:'Max',unit:'rating',axis:'Rating axis unavailable',verified:'Verified rating cap',sample:'Synthetic sample',help:'Rating points. The arithmetic mean describes this group; color shows distance from the mean within the observed range. The sample may not represent all players.'},de:{names:['Kritisch','Tempo','Meisterschaft','Vielseitigkeit'],long:['Kritische Trefferwertung mit sehr langem Namen','Tempowertung mit sehr langem Namen','Meisterschaftswertung mit sehr langem Namen','Vielseitigkeitswertung mit sehr langem Namen'],spec:'Spez.: Arkan',raid:'Schlachtzug',ref:'Wertungs-Vergleich',current:'Aktuell',min:'Min',mean:'Mittelwert',max:'Max',unit:'Wertung',axis:'Wertungsachse fehlt',verified:'Geprüfte Wertungsgrenze',sample:'Synthetische Stichprobe',help:'Wertungspunkte. Der arithmetische Mittelwert beschreibt diese Gruppe; die Farbe zeigt den Abstand innerhalb der beobachteten Spanne. Die Stichprobe muss nicht alle Spieler repräsentieren.'}};
const palette=['#d4464f','#4582e0','#d9a63f','#4db87a'],currents={normal:[500,650,800,950],outside:[1000,650,800,950],partial:[500,650,800,950],missing:[500,650,800,950],unavailable:[500,650,800,950],invalid:[500,650,800,950],zero:[500,500,500,500],longnames:[500,650,800,950],extreme:[1e308,650,800,950]};
const fmt=n=>n==null?'Unknown':(n!==0&&(Math.abs(n)>=1e6||Math.abs(n)<.01)?n.toExponential(1):Math.round(n).toString());const pct=(n,axis)=>Math.max(0,Math.min(100,n/axis*100));
function rowData(kind,i){const zero=kind==='zero',extreme=kind==='extreme'&&i===0;return {current:currents[kind][i],min:extreme?1e-308:zero?500:300+i*150,mean:extreme?1e308:zero?500:500+i*150,max:kind==='partial'&&i===0?null:extreme?1e308:zero?500:700+i*150,axis:kind==='missing'?null:extreme?1e308:2000,status:kind==='missing'?'unverified':kind==='unavailable'?'unavailable':kind==='invalid'?'invalid':'verified'}}
function render(){const skin=$('#skin').value,locale=$('#locale').value,kind=$('#fixture').value,size=$('#size').value,t=copy[locale],full=size==='full',w=full?468:360,h=full?750:424,density=Math.max(0,Math.min(1,(h-424)/326)),start=106+64*density,step=62+(Math.max(62,(h-280)/4)-62)*density,trackOffset=25+9*density,minOffset=47+14*density;const panel=$('#panel');panel.style.width=w+'px';panel.style.height=h+'px';panel.className='panel'+(skin==='flat'?' flat':'')+(full?'':' compact');panel.replaceChildren();
function block(cls,top,html){const el=document.createElement('div');el.className=cls;el.style.top=top+'px';el.innerHTML=html;panel.appendChild(el);return el}block('title',9+9*density,'Stat Compass');block('spec',31+21*density,t.spec);block('tabs',51+44*density,`<button>${t.raid}</button><button>Mythic+</button>`);block('head',88+61*density,`<span>${t.ref}</span><span>${t.current}</span>`);
keys.forEach((key,i)=>{const d=rowData(kind,i),bounds=d.status==='verified'&&d.axis!=null,complete=bounds&&d.min!=null&&d.mean!=null&&d.max!=null,inside=complete&&d.current>=d.min&&d.current<=d.max,span=complete?Math.max(d.mean-d.min,d.max-d.mean):0,strength=inside?1-.42*(span?Math.abs(d.current-d.mean)/span:0):0,fillColor=inside?palette[i]:'#7a858f';const row=block('row',start+i*step,'');row.style.height=(step-2)+"px";row.dataset.stat=key;row.dataset.status=d.status;row.dataset.complete=String(!!complete);const name=kind==='longnames'?t.long[i]:t.names[i],top=document.createElement('div');top.className='top';top.innerHTML=`<span class="name"></span><span class="value">${fmt(d.current)} ${t.unit}</span>`;top.querySelector('.name').textContent=name;row.appendChild(top);const track=document.createElement('div');track.className='track';track.style.top=trackOffset+'px';row.appendChild(track);
if(d.axis!=null){if(bounds&&d.min!=null&&d.max!=null){const band=document.createElement('div');band.className='band';band.style.left=pct(d.min,d.axis)+'%';band.style.width=(pct(d.max,d.axis)-pct(d.min,d.axis))+'%';track.appendChild(band)}const fill=document.createElement('div');fill.className='fill';fill.style.width=pct(d.current,d.axis)+'%';fill.style.background=fillColor;fill.style.opacity=inside?.58+.42*strength:1;track.appendChild(fill);function mark(cls,value){if(value==null)return;const el=document.createElement('div');el.className=cls;el.style.left=pct(value,d.axis)+'%';track.appendChild(el)}mark('own',d.current);if(bounds){mark('tick min',d.min);mark('tick max',d.max);mark('mean-marker',d.mean);mark('mean-stem',d.mean)}}else{const message=document.createElement('div');message.className='axis-status';message.style.top=(trackOffset+1)+'px';message.textContent=t.axis;row.appendChild(message)}
const labels=document.createElement('div');labels.className='labels';labels.style.top=minOffset+'px';labels.innerHTML=`<span>${bounds&&d.min!=null?t.min+' '+fmt(d.min):'Unknown'}</span><span>${bounds&&d.mean!=null?t.mean+' '+fmt(d.mean):'Unknown'}</span><span>${bounds&&d.max!=null?t.max+' '+fmt(d.max):'Unknown'}</span>`;row.appendChild(labels);if(labels.children[1].scrollWidth>labels.children[1].clientWidth && locale==="de")labels.children[1].textContent=labels.children[1].textContent.replace("Mittelwert ","Ø ");const tipText=`${t.help}\n${t.current}: ${fmt(d.current)} ${t.unit}  |  ${t.min}: ${bounds?fmt(d.min):'Unknown'}  |  ${t.mean}: ${bounds?fmt(d.mean):'Unknown'}  |  ${t.max}: ${bounds?fmt(d.max):'Unknown'}\n${d.axis!=null?t.verified+' '+fmt(d.axis)+' (synthetic cap)':t.axis}\n${t.sample}: 27 · sourceStatus: ${d.status}`;row.addEventListener('mouseenter',e=>showTip(tipText,e));row.addEventListener('mousemove',moveTip);row.addEventListener('mouseleave',hideTip)});block('status',h-(62+46*density),`${t.sample}: 27 · ${kind==='missing'?t.axis:t.verified+': '+(kind==='extreme'?'1.0e+308':'2000')}`);block('foot',h-(38+21*density),`<button>${locale==='de'?'Standard':'Default'}</button><button>${locale==='de'?'Flach dunkel':'Flat dark'}</button><button>${locale==='de'?'Zurücksetzen':'Reset'}</button>`);requestAnimationFrame(()=>{window.previewChecks=checkLayout();panel.dataset.checks=window.previewChecks.ok?'pass':'fail'})}
function showTip(text,e){$('#tip').textContent=text;$('#tip').classList.add('visible');moveTip(e)}function moveTip(e){const tip=$('#tip');tip.style.left=Math.max(8,Math.min(e.clientX+15,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=Math.max(8,Math.min(e.clientY+12,innerHeight-tip.offsetHeight-8))+'px'}function hideTip(){$('#tip').classList.remove('visible')}
function checkLayout(){const panel=$('#panel'),rows=[...panel.querySelectorAll('.row')],issues=[];for(const row of rows){const labels=[...row.querySelectorAll('.labels span')];for(const label of labels){if(label.scrollWidth>label.clientWidth+1)issues.push(row.dataset.stat+': label overflow')}if(row.dataset.complete==='false'&&row.querySelector('.band'))issues.push(row.dataset.stat+': partial band');if(row.dataset.status!=='verified'&&row.querySelector('.tick,.mean-marker,.band'))issues.push(row.dataset.stat+': unverified reference');if(row.querySelector('.value').scrollWidth>row.querySelector('.value').clientWidth+1)issues.push(row.dataset.stat+': current overflow')}for(const node of panel.querySelectorAll('.title,.spec,.head,.status,.foot,.row')){if(node.getBoundingClientRect().bottom>panel.getBoundingClientRect().bottom+1)issues.push('panel overflow')}rows[0].dispatchEvent(new MouseEvent("mouseenter",{bubbles:true,clientX:40,clientY:40}));if(!$("#tip").classList.contains("visible")||!$("#tip").textContent.includes(copy[$("#locale").value].mean))issues.push("tooltip interaction");rows[0].dispatchEvent(new MouseEvent("mouseleave",{bubbles:true}));return {ok:issues.length===0,issues,rows:rows.length,fixture:$('#fixture').value,locale:$('#locale').value,size:$('#size').value}}
const params=new URLSearchParams(location.search);for(const id of ['skin','locale','fixture','size']){const value=params.get(id),select=$('#'+id);if(value&&[...select.options].some(o=>o.value===value))select.value=value;select.addEventListener('change',()=>{const url=new URL(location.href);url.searchParams.set(id,select.value);history.replaceState(null,'',url);render()})}render();
</script></html>
